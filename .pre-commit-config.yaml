repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # datos/ tiene espacios sobrantes a propósito ("Lima ") para el episodio de limpieza.
      - id: trailing-whitespace
        exclude: ^datos/
      - id: end-of-file-fixer
        exclude: ^datos/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]  # los CSV de ventas pesan unos 4 MB

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Quita las salidas de los notebooks de ejercicio y la plantilla.
  # Los notebooks de clase y solución conservan sus salidas para verse bien en GitHub.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: ["--keep-id"]
        files: "(ejercicio\\.ipynb|plantilla-notebook\\.ipynb)$"
