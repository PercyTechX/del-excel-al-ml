name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  estilo:
    name: Estilo y formato (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ejecutar pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  pruebas:
    name: Pruebas y notebooks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -e ".[dev]"

      - name: Pruebas del generador y ejecución de todos los notebooks
        run: pytest
